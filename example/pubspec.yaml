name: vision_test_app
description: App to test OpenAI Vision package

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Option 1: Local package (during development)
  openai_vision_flutter:
    path: ../../openai_vision_flutter
  
  # Option 2: Git package
  # openai_vision_flutter:
